  <span>🔄 Hay una nueva versión disponible</span>
  <button id="pwa-update-btn" type="button" style="background:#FFD700;color:#1F4E79;border:none;padding:6px 12px;border-radius:6px;font-weight:700;cursor:pointer;font-size:14px">Actualizar</button>
  <button id="pwa-dismiss-btn" type="button" aria-label="Descartar" style="background:transparent;color:#fff;border:none;font-size:20px;cursor:pointer;padding:0 4px;line-height:1">×</button>
</div>

<script>
// ── PWA: registro de Service Worker + flujo de actualización ──
(function() {
  if (!('serviceWorker' in navigator)) {
    window.PWA = {
      checkUpdate(statusEl) {
        if (statusEl) statusEl.textContent = '⚠ Tu navegador no soporta Service Workers.';
      },
    };
    return;
  }

  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshing) return;
    refreshing = true;
    window.location.reload();
  });

  // ── Actualizarse sola ──
  // Si la persona todavía no ha escrito nada en esta visita, la versión
  // nueva se aplica sin preguntar (la app se recarga una vez). Si ya está
  // llenando algo, no se le interrumpe: sale el aviso con el botón.
  let pwaEscribio = false;
  let pwaOcultaDesde = 0;
  const marcar = (e) => { if (e.isTrusted) pwaEscribio = true; };
  document.addEventListener('input', marcar, true);
  document.addEventListener('change', marcar, true);
  // Si la app estuvo guardada 5 minutos o más, lo escrito antes ya no cuenta.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') pwaOcultaDesde = Date.now();
    else if (pwaOcultaDesde && Date.now() - pwaOcultaDesde >= 5 * 60 * 1000) pwaEscribio = false;
  });
  try {
    if (sessionStorage.getItem('pwa_actualizada') === '1') {
      sessionStorage.removeItem('pwa_actualizada');
      window.addEventListener('load', () => setTimeout(() => {
        if (typeof showToast === 'function') showToast('✓ App actualizada a la última versión', 'success', 3500);
      }, 600));
    }
  } catch (_) {}

  function showPwaUpdate(worker) {
    if (!pwaEscribio) {
      try { sessionStorage.setItem('pwa_actualizada', '1'); } catch (_) {}
      worker.postMessage({ type: 'SKIP_WAITING' });
      return;
    }
    const banner = document.getElementById('pwa-update-banner');
    if (!banner) return;
    banner.style.display = 'flex';
    document.getElementById('pwa-update-btn').onclick = () => {
      worker.postMessage({ type: 'SKIP_WAITING' });
    };
    document.getElementById('pwa-dismiss-btn').onclick = () => {
      banner.style.display = 'none';
    };
  }

  window.PWA = {
    showUpdateBanner: showPwaUpdate,
    async checkUpdate(statusEl) {
      const setStatus = (txt) => { if (statusEl) statusEl.textContent = txt; };
      setStatus('🔄 Buscando actualizaciones…');
      try {
        const reg = await navigator.serviceWorker.getRegistration();
        if (!reg) {
          setStatus('⚠ Service Worker aún no registrado — recargá la página una vez (Ctrl+F5) y volvé a intentar.');
          return;
        }
        await reg.update();
        if (reg.waiting && navigator.serviceWorker.controller) {
          setStatus('✨ Nueva versión disponible — usá el banner azul de abajo para aplicarla.');
          showPwaUpdate(reg.waiting);
          return;
        }
        if (reg.installing) {
          setStatus('⬇ Descargando nueva versión… Esperá unos segundos y volvé a tocar el botón.');
          return;
        }
        setStatus('✓ Ya estás en la última versión.');
      } catch (err) {
        setStatus('⚠ Error al buscar actualizaciones: ' + (err && err.message || err));
      }
    },
  };

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      if (reg.waiting && navigator.serviceWorker.controller) {
        showPwaUpdate(reg.waiting);
      }
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            showPwaUpdate(nw);
          }
        });
      });
    }).catch(err => console.warn('SW registration failed:', err));

    const buscarVersion = () => navigator.serviceWorker.getRegistration().then(reg => {
      if (!reg) return;
      // Una versión que quedó esperando se aplica al volver, si no hay nada a medias.
      if (reg.waiting && navigator.serviceWorker.controller && !pwaEscribio) showPwaUpdate(reg.waiting);
      return reg.update();
    }).catch(() => {});
    setInterval(buscarVersion, 30 * 60 * 1000);
    // En el celular la app queda abierta días: al volver a ella, buscar versión nueva.
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') buscarVersion(); });
  });
})();
</script>
</body>
