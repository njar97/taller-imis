<nav>

    <button type="button" id="nav-inicio" class="nav-inicio" onclick="irInicio()" title="Volver a Inicio" aria-label="Volver a Inicio"><svg class="ico" aria-hidden="true"><use href="#i-casa"/></svg></button>

      <span class="nav-brand-app">Taller IMIS</span>

             oninput="buscadorOnInput(event)" onfocus="buscadorOnInput(event)"

  <!-- Orden por uso en la temporada 2026: Corte, Producción y Bodega son el
       trabajo diario (visibles por defecto; se pueden esconder en Ajustes →
       Sistema). Etiquetas en palabras simples.
       En móvil (≤640px) esta misma barra se fija ABAJO estilo bottom-nav
       (ícono arriba, label abajo) — ver styles.css. -->
  <!-- PANTALLA ÚNICA (nov-2026): el menú de pestañas ya NO se muestra (css
       .nav-tabs{display:none}). Se deja en el DOM porque abrirPestana, el
       botón atrás y el buscador buscan aquí el botón de cada pantalla. Se
       entra por Inicio (4 pasos) y por «Todo lo demás»; se vuelve con 🏠. -->
  <div class="nav-tabs">
    <div class="nav-tab active" onclick="switchTab('inicio',this)"><span class="nav-tab-ico">🏠</span><span class="nav-tab-lbl">Inicio</span></div>
    <div class="nav-tab" id="tab-corte" onclick="switchTab('corte',this)"><span class="nav-tab-ico">✂️</span><span class="nav-tab-lbl">Corte</span></div>
    <div class="nav-tab" id="tab-produccion" onclick="switchTab('produccion',this)"><span class="nav-tab-ico">🏭</span><span class="nav-tab-lbl">Producción</span></div>
    <div class="nav-tab" onclick="switchTab('bodega',this)"><span class="nav-tab-ico">📦</span><span class="nav-tab-lbl">Bodega</span><span id="nav-badge-bodega" class="nav-badge" style="display:none"></span></div>
    <div class="nav-tab" onclick="switchTab('empaque',this)"><span class="nav-tab-ico">🧺</span><span class="nav-tab-lbl">Empaque</span></div>
    <div class="nav-tab" onclick="switchTab('registro',this)"><span class="nav-tab-ico">📋</span><span class="nav-tab-lbl">Registro</span></div>
    <div class="nav-tab" onclick="switchTab('estadistica',this)"><span class="nav-tab-ico">📊</span><span class="nav-tab-lbl">Estadística</span></div>
    <div class="nav-tab" onclick="switchTab('config',this)"><span class="nav-tab-ico">⚙️</span><span class="nav-tab-lbl">Ajustes</span></div>
  </div>
</nav>
<!-- Pantalla única: en el celular, botón fijo abajo para volver (css .barra-inicio) -->
<button type="button" id="barra-inicio" class="barra-inicio" onclick="irInicio()"><svg class="ico" aria-hidden="true"><use href="#i-casa"/></svg> Inicio</button>
<!-- Asistencia: la app arranca en versión corta (una palabra por botón). Este
     botón prende o apaga la versión extendida: explicaciones, textos largos y
     los «¿Cómo se usa?» de cada pantalla (css .solo-asistencia / .ayuda-tip). -->
<button type="button" id="btn-ayuda" class="btn-ayuda" onclick="toggleAsistencia()" aria-pressed="false" aria-label="Mostrar u ocultar las explicaciones" title="Asistencia">?</button>
