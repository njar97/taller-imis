<!-- AUTH OVERLAY: 3 modos (login / forgot / reset) controlados por setAuthMode() -->
<div id="auth-overlay" class="auth-overlay">
  <div class="auth-box">
    <div class="auth-logo">T</div>
    <h2>Taller IMIS</h2>
    <p id="auth-sub" class="auth-sub">Iniciá sesión para continuar</p>
    <form id="auth-form" onsubmit="return doAuthSubmit(event)">
      <div id="auth-field-email" class="field">
        <label for="auth-email">Email</label>
        <input id="auth-email" type="email" autocomplete="username" required>
      </div>
      <div id="auth-field-pass" class="field">
        <label for="auth-pass">Contraseña</label>
        <input id="auth-pass" type="password" autocomplete="current-password" required>
      </div>
      <div id="auth-field-newpass" class="field" style="display:none">
        <label for="auth-newpass">Nueva contraseña (mínimo 6)</label>
        <input id="auth-newpass" type="password" autocomplete="new-password" minlength="6">
      </div>
      <div id="auth-alert"></div>
      <button id="auth-submit" type="submit" class="btn btn-primary btn-block">Entrar</button>
    </form>
    <div style="margin-top:12px;text-align:center;font-size:13px">
      <a id="auth-link-forgot" href="javascript:void(0)" onclick="setAuthMode('forgot')" style="color:var(--azul2);cursor:pointer;text-decoration:none">¿Olvidaste tu contraseña?</a>
      <a id="auth-link-login" href="javascript:void(0)" onclick="setAuthMode('login')" style="color:var(--azul2);cursor:pointer;text-decoration:none;display:none">← Volver al login</a>
    </div>
  </div>
</div>

<!-- MINI MODAL: crear KEY nueva -->
<div id="mini-modal" class="mini-modal">
  <div class="mini-modal-box">
    <h3 id="mm-title">Agregar talla al catálogo</h3>
    <div id="mm-body"></div>
    <div class="actions">
      <button class="btn btn-ghost btn-sm" onclick="cerrarMiniModal()">Cancelar</button>
      <button class="btn btn-primary btn-sm" id="mm-ok" onclick="confirmarMiniModal()">Agregar</button>
    </div>
  </div>
</div>

<!-- DETALLE OVERLAY -->
<div id="detalle-overlay" class="detalle-overlay">
  <div class="detalle-modal">
    <div class="detalle-header">
      <div class="detalle-titulo" id="det-titulo">Detalle</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" id="det-btn-editar" onclick="editarRegistro()" style="display:none"><svg class="ico" aria-hidden="true" width="1em" height="1em"><use href="#i-lapiz"/></svg> Editar</button>
        <button class="btn btn-ghost btn-sm" onclick="cerrarDetalle()">✕ Cerrar</button>
      </div>
    </div>
    <div id="det-contenido"></div>
    <!-- «Eliminar» va abajo y chico, lejos de «Cerrar», para no tocarlo sin querer -->
    <div style="margin-top:22px;text-align:center">
      <button class="btn btn-ghost btn-sm" id="det-btn-eliminar" onclick="eliminarRegistro()" style="display:none;font-size:12px;color:#b00020;border-color:#e6b8bf"><svg class="ico" aria-hidden="true" width="1em" height="1em"><use href="#i-basura"/></svg> Eliminar este registro</button>
    </div>
  </div>
</div>

<!-- Selector de talla alterna para modo empaque (pantalón largo, etc) -->
<div id="talla-alt-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:flex-end;justify-content:center;padding:0" onclick="if(event.target===this)cerrarSelectorTallaAlt()">
  <div style="background:white;border-radius:12px 12px 0 0;max-width:480px;width:100%;max-height:85vh;overflow:auto;box-shadow:0 -4px 20px rgba(0,0,0,0.3)">
    <div style="padding:14px 16px;border-bottom:1px solid #EEE;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:white">
      <div>
        <div style="font-weight:700;color:#1F4E79;font-size:15px"><svg class="ico" aria-hidden="true" width="1em" height="1em"><use href="#i-regla"/></svg> Empacar con otra talla</div>
        <div id="talla-alt-sub" style="font-size:12px;color:#666;margin-top:2px">—</div>
      </div>
      <button type="button" onclick="cerrarSelectorTallaAlt()" style="background:transparent;border:none;font-size:22px;cursor:pointer;color:#666;padding:4px 8px" aria-label="Cerrar">×</button>
    </div>
    <div id="talla-alt-lista" style="padding:8px 16px 16px"></div>
  </div>
</div>

<!-- Modal GLOBAL: 🔒 Reservar tallas — se abre desde Bodega (elige escuela
     en el modal) o desde la sesión de empaque (escuela ya elegida).
     Lógica en empaque.js (emqAbrirReserva / emqResvRender). -->
<div id="emq-reserva-modal" class="modal" style="display:none">
  <div class="modal-content" style="max-width:520px">
    <div class="modal-header">
      <div class="card-title" style="margin:0"><svg class="ico" aria-hidden="true" width="1em" height="1em"><use href="#i-candado"/></svg> Reservar tallas</div>
      <button class="btn btn-ghost btn-sm" onclick="emqCerrarReserva()">✕</button>
    </div>
    <div class="modal-body">
      <div id="emq-reserva-contenido"></div>
    </div>
  </div>
</div>
<!-- Escanear etiqueta de bulto (QR) -->
<div id="qr-modal" class="modal" style="display:none;background:rgba(0,0,0,0.92);z-index:1600;flex-direction:column;padding:0">
  <div class="modal-header" style="width:100%;border:0;color:#fff">
    <div style="font-weight:700;font-size:17px">Escanear etiqueta</div>
    <button class="btn btn-ghost btn-sm" style="color:#fff;font-size:20px;min-width:44px;min-height:44px" onclick="cerrarEscanerQR()" aria-label="Cerrar">✕</button>
  </div>
  <video id="qr-video" playsinline muted style="flex:1;min-height:0;width:100%;object-fit:cover;background:#000"></video>
  <div id="qr-msg" style="width:100%;padding:14px 14px 8px;text-align:center;color:#fff;font-size:16px;font-weight:600"></div>
  <form onsubmit="qrAbrirPorCodigo(); return false;" style="width:100%;padding:4px 14px calc(16px + env(safe-area-inset-bottom));display:flex;gap:8px;box-sizing:border-box">
    <input id="qr-codigo" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="O escriba el código" aria-label="Código del bulto" style="flex:1;min-width:0;padding:14px 12px;border:0;border-radius:12px;font-size:17px;text-transform:uppercase">
    <button type="submit" style="flex:none;padding:14px 18px;border:0;border-radius:12px;background:#16A34A;color:#fff;font-size:17px;font-weight:700;cursor:pointer">Abrir</button>
  </form>
  <div id="qr-opciones" style="width:100%;padding:0 14px 12px;box-sizing:border-box"></div>
</div>
